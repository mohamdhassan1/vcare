name: vcare
description: "VCare - Doctor Appointment Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0

  # Secure local storage
  flutter_secure_storage: ^9.2.2

  # UI / Typography
  google_fonts: ^6.2.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Icons
  cupertino_icons: ^1.0.8

  # Profile photo selection
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/common/